name: WebdriverIO Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/webdriverio/**'
  pull_request:
    paths:
      - '**/webdriverio/**'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [
          'best-practices',
          'examples/w3c',
          'examples/deque',
          'examples/cucumberjs',
          'examples/typescript',
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
        working-directory: webdriverio/desktop/${{ matrix.directory }}
      - name: Run WebDriver tests
        run: npm run test.saucelabs.eu
        working-directory: webdriverio/desktop/${{ matrix.directory }}

  mobile-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: 'examples'
            variant: 'test.saucelabs.eu'
          - directory: 'best-practices'
            variant: 'test.saucelabs.android.eu'
          - directory: 'best-practices'
            variant: 'test.saucelabs.ios.eu'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
        working-directory: webdriverio/mobile-web/${{ matrix.directory }}
      - name: Run Appium Web tests
        run: npm run ${{ matrix.variant }}
        working-directory: webdriverio/mobile-web/${{ matrix.directory }}

  mobile-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: 'best-practices'
            variant: 'test.saucelabs.android.emu.eu'
          - directory: 'best-practices'
            variant: 'test.saucelabs.ios.sim.eu'
          - directory: 'best-practices'
            variant: 'test.saucelabs.android.rdc.eu'
          - directory: 'best-practices'
            variant: 'test.saucelabs.ios.rdc.eu'
          - directory: 'examples/up-download-file'
            variant: 'test.sauce.android.emulator.eu'
          - directory: 'examples/up-download-file'
            variant: 'test.sauce.ios.simulator.eu'
          - directory: 'examples/simple-example'
            variant: 'test.saucelabs.android.emu.eu'
          - directory: 'examples/simple-example'
            variant: 'test.saucelabs.ios.sim.eu'
          - directory: 'examples/appium-flutter-integration'
            variant: 'android.flutter.sauce.rdc.app.eu'
          - directory: 'examples/appium-flutter-integration'
            variant: 'ios.flutter.sauce.rdc.app.eu'
          - directory: 'examples/appium-flutter'
            variant: 'test.sauce.real.android.eu'
          - directory: 'examples/appium-flutter'
            variant: 'test.sauce.real.ios.eu'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
        working-directory: webdriverio/mobile-app/${{ matrix.directory }}
      - name: Run Appium App tests
        run: npm run ${{ matrix.variant }}
        working-directory: webdriverio/mobile-app/${{ matrix.directory }}
